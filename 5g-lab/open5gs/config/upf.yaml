logger:
  file: /opt/open5gs/var/log/open5gs/upf.log
  level: info

global:
  max:
    ue: 1024

upf:
  pfcp:
    server:
      - dev: eth2
  gtpu:
    server:
      - dev: eth1
  metrics:
    server:
      - dev: eth0
        port: 9090
  session:
    - subnet: 10.45.0.1/16
    - subnet: 2001:db8:cafe::1/48
