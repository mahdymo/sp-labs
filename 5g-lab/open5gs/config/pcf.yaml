db_uri: mongodb://mongodb:27017/open5gs

logger:
  file:
    path: /opt/open5gs/var/log/open5gs/pcf.log
  level: info

global:
  max:
    ue: 1024

pcf:
  sbi:
    server:
      - dev: eth0
        port: 7777
    client:
      scp:
        - uri: http://scp:7777
  metrics:
    server:
      - dev: eth0
        port: 9090
