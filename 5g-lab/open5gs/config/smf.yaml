logger:
  file: /opt/open5gs/var/log/open5gs/smf.log
  level: info

global:
  max:
    ue: 1024

smf:
  sbi:
    server:
      - dev: eth0
        port: 7777
    client:
      scp:
        - uri: http://scp:7777
  pfcp:
    server:
      - dev: eth1
    client:
      upf:
        - address: 10.33.36.14
  gtpc:
    server:
      - address: 10.33.33.13
  gtpu:
    server:
      - address: 10.33.33.13
  metrics:
    server:
      - address: 10.33.33.13
        port: 9090
  session:
    - subnet: 10.45.0.1/16
      dnn: internet
    - subnet: 2001:db8:cafe::1/48
  dns:
    - 8.8.8.8
    - 8.8.4.4
    - 2001:4860:4860::8888
    - 2001:4860:4860::8844
  mtu: 1400
