# ==============================================================================
# SP-Labs 5G Lab — Docker Compose
# Open5GS 5G SA Core + UERANSIM (gNB + UE)
# ==============================================================================

networks:
  sbi:
    name: sp-labs-sbi
    driver: bridge
    ipam:
      config:
        - subnet: 10.33.33.0/24
  n2:
    name: sp-labs-n2
    driver: bridge
    ipam:
      config:
        - subnet: 10.33.34.0/24
  n3:
    name: sp-labs-n3
    driver: bridge
    ipam:
      config:
        - subnet: 10.33.35.0/24
  n4:
    name: sp-labs-n4
    driver: bridge
    ipam:
      config:
        - subnet: 10.33.36.0/24
  n6:
    name: sp-labs-n6
    driver: bridge
    ipam:
      config:
        - subnet: 10.33.37.0/24
  mgmt:
    name: sp-labs-mgmt
    driver: bridge
    ipam:
      config:
        - subnet: 10.33.38.0/24

volumes:
  mongodb_data:
    name: sp-labs-mongodb-data

services:
  # ============================================================================
  # Database
  # ============================================================================
  mongodb:
    image: mongo:6.0
    container_name: mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    networks:
      sbi:
        ipv4_address: 10.33.33.2

  # ============================================================================
  # 5G Core — NRF (NF Repository Function)
  # ============================================================================
  nrf:
    image: openverso/open5gs:2.7.2
    container_name: nrf
    restart: unless-stopped
    command: open5gs-nrfd
    volumes:
      - ./open5gs/config/nrf.yaml:/opt/open5gs/etc/open5gs/nrf.yaml
    networks:
      sbi:
        ipv4_address: 10.33.33.10
      mgmt:
        ipv4_address: 10.33.38.10
    depends_on:
      - mongodb

  # ============================================================================
  # 5G Core — SCP (Service Communication Proxy)
  # ============================================================================
  scp:
    image: openverso/open5gs:2.7.2
    container_name: scp
    restart: unless-stopped
    command: open5gs-scpd
    volumes:
      - ./open5gs/config/scp.yaml:/opt/open5gs/etc/open5gs/scp.yaml
    networks:
      sbi:
        ipv4_address: 10.33.33.11
    depends_on:
      - nrf

  # ============================================================================
  # 5G Core — AMF (Access and Mobility Management Function)
  # ============================================================================
  amf:
    image: openverso/open5gs:2.7.2
    container_name: amf
    restart: unless-stopped
    command: open5gs-amfd
    volumes:
      - ./open5gs/config/amf.yaml:/opt/open5gs/etc/open5gs/amf.yaml
    networks:
      sbi:
        ipv4_address: 10.33.33.12
      n2:
        ipv4_address: 10.33.34.12
      mgmt:
        ipv4_address: 10.33.38.12
    depends_on:
      - scp

  # ============================================================================
  # 5G Core — SMF (Session Management Function)
  # ============================================================================
  smf:
    image: openverso/open5gs:2.7.2
    container_name: smf
    restart: unless-stopped
    command: open5gs-smfd
    volumes:
      - ./open5gs/config/smf.yaml:/opt/open5gs/etc/open5gs/smf.yaml
    networks:
      sbi:
        ipv4_address: 10.33.33.13
      n4:
        ipv4_address: 10.33.36.13
      mgmt:
        ipv4_address: 10.33.38.13
    depends_on:
      - scp

  # ============================================================================
  # 5G Core — UPF (User Plane Function)
  # ============================================================================
  upf:
    image: openverso/open5gs:2.7.2
    container_name: upf
    restart: unless-stopped
    command: open5gs-upfd
    privileged: true
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
    volumes:
      - ./open5gs/config/upf.yaml:/opt/open5gs/etc/open5gs/upf.yaml
    networks:
      n3:
        ipv4_address: 10.33.35.14
      n4:
        ipv4_address: 10.33.36.14
      n6:
        ipv4_address: 10.33.37.14
      mgmt:
        ipv4_address: 10.33.38.14
    depends_on:
      - smf

  # ============================================================================
  # 5G Core — AUSF, UDM, UDR
  # ============================================================================
  ausf:
    image: openverso/open5gs:2.7.2
    container_name: ausf
    restart: unless-stopped
    command: open5gs-ausfd
    volumes:
      - ./open5gs/config/ausf.yaml:/opt/open5gs/etc/open5gs/ausf.yaml
    networks:
      sbi:
        ipv4_address: 10.33.33.15
    depends_on:
      - scp

  udm:
    image: openverso/open5gs:2.7.2
    container_name: udm
    restart: unless-stopped
    command: open5gs-udmd
    volumes:
      - ./open5gs/config/udm.yaml:/opt/open5gs/etc/open5gs/udm.yaml
    networks:
      sbi:
        ipv4_address: 10.33.33.16
    depends_on:
      - scp

  udr:
    image: openverso/open5gs:2.7.2
    container_name: udr
    restart: unless-stopped
    command: open5gs-udrd
    volumes:
      - ./open5gs/config/udr.yaml:/opt/open5gs/etc/open5gs/udr.yaml
    networks:
      sbi:
        ipv4_address: 10.33.33.17
    depends_on:
      - mongodb
      - scp

  # ============================================================================
  # 5G Core — PCF, NSSF, BSF
  # ============================================================================
  pcf:
    image: openverso/open5gs:2.7.2
    container_name: pcf
    restart: unless-stopped
    command: open5gs-pcfd
    volumes:
      - ./open5gs/config/pcf.yaml:/opt/open5gs/etc/open5gs/pcf.yaml
    networks:
      sbi:
        ipv4_address: 10.33.33.18
    depends_on:
      - mongodb
      - scp

  nssf:
    image: openverso/open5gs:2.7.2
    container_name: nssf
    restart: unless-stopped
    command: open5gs-nssfd
    volumes:
      - ./open5gs/config/nssf.yaml:/opt/open5gs/etc/open5gs/nssf.yaml
    networks:
      sbi:
        ipv4_address: 10.33.33.19
    depends_on:
      - scp

  bsf:
    image: openverso/open5gs:2.7.2
    container_name: bsf
    restart: unless-stopped
    command: open5gs-bsfd
    volumes:
      - ./open5gs/config/bsf.yaml:/opt/open5gs/etc/open5gs/bsf.yaml
    networks:
      sbi:
        ipv4_address: 10.33.33.20
    depends_on:
      - scp

  # ============================================================================
  # 5G Core — WebUI (Subscriber Management)
  # ============================================================================
  webui:
    image: openverso/open5gs:2.7.2
    container_name: webui
    restart: unless-stopped
    command: node /opt/open5gs/webui/server/index.js
    environment:
      - DB_URI=mongodb://mongodb:27017/open5gs
      - HOSTNAME=0.0.0.0
      - PORT=9999
    ports:
      - "9999:9999"
    networks:
      sbi:
        ipv4_address: 10.33.33.21
      mgmt:
        ipv4_address: 10.33.38.21
    depends_on:
      - mongodb

  # ============================================================================
  # UERANSIM — gNodeB (5G Base Station Simulator)
  # ============================================================================
  gnb:
    image: openverso/ueransim:3.2.6
    container_name: gnb
    restart: unless-stopped
    command: nr-gnb -c /etc/ueransim/gnb.yaml
    volumes:
      - ./ueransim/config/gnb.yaml:/etc/ueransim/gnb.yaml
    cap_add:
      - NET_ADMIN
    networks:
      n2:
        ipv4_address: 10.33.34.100
      n3:
        ipv4_address: 10.33.35.100
      mgmt:
        ipv4_address: 10.33.38.100
    depends_on:
      - amf
      - upf

  # ============================================================================
  # UERANSIM — UE (User Equipment Simulator)
  # ============================================================================
  ue:
    image: openverso/ueransim:3.2.6
    container_name: ue
    restart: unless-stopped
    command: nr-ue -c /etc/ueransim/ue.yaml
    volumes:
      - ./ueransim/config/ue.yaml:/etc/ueransim/ue.yaml
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      mgmt:
        ipv4_address: 10.33.38.101
    depends_on:
      - gnb

