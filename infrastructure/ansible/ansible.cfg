# ==============================================================================
# SP-Labs — Ansible Configuration
# ==============================================================================
# This file configures Ansible defaults for the SP-Labs project.
# It is auto-detected when you run ansible-playbook from this directory.
# ==============================================================================

[defaults]
# Inventory file
inventory = inventory.ini

# Default remote user (override per-host in inventory or group_vars)
remote_user = ubuntu

# SSH private key (override with ANSIBLE_SSH_KEY env var or -i flag)
private_key_file = ~/.ssh/sp-labs-key

# Roles path
roles_path = roles

# Don't prompt for host key verification in lab environments
host_key_checking = False

# Gather facts at playbook start
gathering = smart

# Retry files are noisy — disable in lab
retry_files_enabled = False

# Increase SSH timeout for slow VM provisioning
timeout = 30

# Stdout callback — cleaner output
stdout_callback = yaml

# Forks — number of parallel connections (tune to your VM count)
forks = 10

# Vault password file (create this file, do NOT commit it)
# Uncomment when using Ansible Vault:
# vault_password_file = .vault-pass

[privilege_escalation]
# All SP-Labs playbooks require sudo
become = True
become_method = sudo
become_user = root

# If VMs require a sudo password, set it via:
#   1. ansible-vault (recommended) — vault_ansible_become_pass variable
#   2. --ask-become-pass flag at runtime
#   3. NOPASSWD in sudoers (simplest for lab)
become_ask_pass = False

[ssh_connection]
# Use SSH pipelining for faster execution
pipelining = True

# SSH arguments — ControlMaster for connection reuse
ssh_args = -o ControlMaster=auto -o ControlPersist=300s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null

# SCP for file transfer (more compatible than sftp)
transfer_method = smart

[inventory]
# Enable inventory plugins
enable_plugins = ini, yaml, auto
