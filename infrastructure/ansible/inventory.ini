# ==============================================================================
# SP-Labs Ansible Inventory
# ==============================================================================
#
# HOW TO USE:
#
#   SINGLE-HOST (all-in-one, default):
#     - Leave as-is. The [single_host] group uses localhost.
#     - Deploy with: make deploy-5g  (or ansible-playbook site.yml)
#
#   MULTI-VM:
#     1. Comment out "single_host" under [fiveg:children], [sixg:children],
#        [mon:children]
#     2. Uncomment the [core_5g], [ran_sim], etc. groups below
#     3. Replace the placeholder IPs with your actual VM IPs
#     4. Set up SSH keys: ./infrastructure/scripts/setup-ssh-keys.sh
#     5. Validate:        ./infrastructure/scripts/preflight-check.sh
#     6. Deploy:          ansible-playbook -i inventory.ini site.yml
#
#   PARTIAL (e.g., 5G only, no 6G):
#     - Comment out the groups you don't have (sionna, ns3, oran)
#     - Ansible will skip those groups automatically
#
# SSH CONFIG:
#   SSH key path and user are set in ansible.cfg (same directory).
#   Override per-host by adding ansible_ssh_private_key_file= below.
#
# See docs/PREREQUISITES.md for full setup instructions.
# ==============================================================================

[all:vars]
ansible_user=ubuntu
ansible_become=yes
ansible_python_interpreter=/usr/bin/python3
sp_labs_root=/opt/sp-labs

# ==============================================================================
# SINGLE-HOST (all-in-one) — Default
# ==============================================================================
[single_host]
localhost ansible_connection=local

# ==============================================================================
# MULTI-VM — Uncomment and set IPs for your environment
# ==============================================================================
# Replace 192.168.1.x with your actual VM IPs.
# The ansible_host value is what the jump host uses to SSH to the VM.
# Optional: add ansible_port=22 if SSH is on a non-standard port.
#           add ansible_ssh_private_key_file=~/.ssh/custom-key per host.

# [core_5g]
# vm-5g-core ansible_host=192.168.1.10    # Open5GS 5G Core + MongoDB

# [ran_sim]
# vm-ran-sim ansible_host=192.168.1.20    # UERANSIM gNB + UE simulator

# [upf]
# vm-upf ansible_host=192.168.1.30        # Dedicated UPF (optional, high-throughput)

# [sionna]
# vm-sionna ansible_host=192.168.1.40     # NVIDIA Sionna (needs GPU)

# [ns3]
# vm-ns3 ansible_host=192.168.1.50        # ns-3 network simulator

# [oran]
# vm-oran ansible_host=192.168.1.60       # O-RAN Near-RT RIC

# [monitoring]
# vm-monitor ansible_host=192.168.1.70    # Prometheus + Grafana

# ==============================================================================
# GROUP MAPPINGS — Controls which playbooks target which hosts
# ==============================================================================
# For multi-VM: comment "single_host" and uncomment the VM groups.

[fiveg:children]
single_host
# core_5g
# ran_sim
# upf

[sixg:children]
single_host
# sionna
# ns3
# oran

[mon:children]
single_host
# monitoring
