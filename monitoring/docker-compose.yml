# ==============================================================================
# SP-Labs Monitoring Stack — Prometheus + Grafana + Node Exporter
# ==============================================================================

networks:
  mgmt:
    name: sp-labs-mgmt
    external: true

volumes:
  prometheus_data:
    name: sp-labs-prometheus-data
  grafana_data:
    name: sp-labs-grafana-data

services:
  # ============================================================================
  # Prometheus — Metrics Collection
  # ============================================================================
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      mgmt:
        ipv4_address: 10.33.38.200

  # ============================================================================
  # Grafana — Dashboards
  # ============================================================================
  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-sp-labs-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      mgmt:
        ipv4_address: 10.33.38.201
    depends_on:
      - prometheus

  # ============================================================================
  # Node Exporter — Host Metrics
  # ============================================================================
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      mgmt:
        ipv4_address: 10.33.38.202
