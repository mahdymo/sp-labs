# ==============================================================================
# SP-Labs Prometheus Configuration
# ==============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # --------------------------------------------------------------------------
  # Prometheus self-monitoring
  # --------------------------------------------------------------------------
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          component: 'monitoring'

  # --------------------------------------------------------------------------
  # Host metrics via Node Exporter
  # --------------------------------------------------------------------------
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          component: 'infrastructure'

  # --------------------------------------------------------------------------
  # Open5GS 5G Core NF Metrics
  # --------------------------------------------------------------------------
  # NF metrics bind to their SBI interface (eth0 in each container).
  # Prometheus is on the mgmt network, so we need to reach them via
  # the SBI addresses. Since Prometheus isn't on the SBI network,
  # we target the mgmt IPs and need the NFs to bind metrics there.
  # For now, use SBI IPs — we'll add Prometheus to the SBI network.
  - job_name: 'open5gs-amf'
    scrape_interval: 5s
    static_configs:
      - targets: ['10.33.33.12:9090']
        labels:
          component: '5g-core'
          nf: 'amf'

  - job_name: 'open5gs-smf'
    scrape_interval: 5s
    static_configs:
      - targets: ['10.33.33.13:9090']
        labels:
          component: '5g-core'
          nf: 'smf'

  - job_name: 'open5gs-upf'
    scrape_interval: 5s
    static_configs:
      - targets: ['10.33.38.14:9090']
        labels:
          component: '5g-core'
          nf: 'upf'
