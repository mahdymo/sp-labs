# ==============================================================================
# SP-Labs Prometheus Configuration
# ==============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # --------------------------------------------------------------------------
  # Prometheus self-monitoring
  # --------------------------------------------------------------------------
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          component: 'monitoring'

  # --------------------------------------------------------------------------
  # Host metrics via Node Exporter
  # --------------------------------------------------------------------------
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          component: 'infrastructure'

  # --------------------------------------------------------------------------
  # Open5GS 5G Core NF Metrics
  # --------------------------------------------------------------------------
  - job_name: 'open5gs-amf'
    static_configs:
      - targets: ['10.33.38.12:9090']
        labels:
          component: '5g-core'
          nf: 'amf'

  - job_name: 'open5gs-smf'
    static_configs:
      - targets: ['10.33.38.13:9090']
        labels:
          component: '5g-core'
          nf: 'smf'

  - job_name: 'open5gs-upf'
    static_configs:
      - targets: ['10.33.38.14:9090']
        labels:
          component: '5g-core'
          nf: 'upf'
