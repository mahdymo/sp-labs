# ==============================================================================
# SP-Labs Prometheus Configuration
# ==============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # --------------------------------------------------------------------------
  # Prometheus self-monitoring
  # --------------------------------------------------------------------------
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          component: 'monitoring'

  # --------------------------------------------------------------------------
  # Host metrics via Node Exporter
  # --------------------------------------------------------------------------
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          component: 'infrastructure'

  # --------------------------------------------------------------------------
  # Open5GS 5G Core NF Metrics
  # --------------------------------------------------------------------------
  # AMF/SMF metrics bind to their SBI IP (address: in config).
  # UPF metrics bind to its mgmt IP (10.33.38.14).
  # Prometheus is on both sbi and mgmt networks, so all are reachable.
  - job_name: 'open5gs-amf'
    scrape_interval: 5s
    static_configs:
      - targets: ['10.33.33.12:9090']
        labels:
          component: '5g-core'
          nf: 'amf'

  - job_name: 'open5gs-smf'
    scrape_interval: 5s
    static_configs:
      - targets: ['10.33.33.13:9090']
        labels:
          component: '5g-core'
          nf: 'smf'

  - job_name: 'open5gs-upf'
    scrape_interval: 5s
    static_configs:
      - targets: ['10.33.38.14:9090']
        labels:
          component: '5g-core'
          nf: 'upf'

  # --------------------------------------------------------------------------
  # BIG-IP Telemetry Streaming (CGNAT / AFM / DNS)
  # --------------------------------------------------------------------------
  # Requires F5 Telemetry Streaming extension configured with Prometheus
  # pull consumer on BIG-IP. Enable this section after deploying BIG-IP.
  # See: docs/LAB_GUIDE.md §19 — BIG-IP Integration
  #
  # - job_name: 'bigip-gi-lan'
  #   scrape_interval: 30s
  #   scrape_timeout: 15s
  #   metrics_path: '/mgmt/shared/telemetry/pullconsumer/Prometheus_Pull'
  #   basic_auth:
  #     username: 'admin'
  #     password: 'admin'       # Change to match your BIG-IP password
  #   tls_config:
  #     insecure_skip_verify: true
  #   static_configs:
  #     - targets: ['10.1.10.200:443']
  #       labels:
  #         component: 'bigip'
  #         role: 'gi-lan'
